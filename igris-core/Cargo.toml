[package]
name = "igris-core"
description = "The platform-independent IGRIS core: intelligence, orchestration, memory, tools and persistence"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Test doubles (fake computer driver, scripted AI provider) for platform crates' tests.
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "stream", "json", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
html2text = "0.14"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pdf-extract = "0.12.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
