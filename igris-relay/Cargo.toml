[package]
name = "igris-relay"
description = "Minimal relay for one user's IGRIS devices: authenticates devices, routes end-to-end encrypted messages, presence, short offline queue"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "igris-relay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "net"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = "0.3"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
