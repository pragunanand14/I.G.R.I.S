name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries (WebKitGTK, X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # tauri::generate_context! embeds the built frontend, so build it first.
      - run: npm ci
      - run: npx vite build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Core stays platform-independent
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # igris-core must build without Tauri, a webview or OS APIs (and without the desktop crate).
          deps=$(cargo tree -p igris-core -e normal --prefix none --locked | cut -d' ' -f1 | sort -u)
          if echo "$deps" | grep -xE 'igris|tauri.*|wry|tao|webview2-com.*|windows|x11rb|xcap|sysinfo|trash|lnk'; then
            echo "::error::igris-core depends on a desktop/platform crate"; exit 1
          fi
          cargo clippy -p igris-core --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  ntfy-live:
    name: Cross-device over the real ntfy.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ntfy-live
      - name: Two IGRIS devices pair and run a task through ntfy.sh
        env:
          IGRIS_NTFY_LIVE: "1"
        run: cargo test -p igris-core --lib --locked live_ntfy -- --ignored --nocapture

  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on known vulnerabilities; "unmaintained"/"unsound" warnings are reported but allowed (see docs/SECURITY.md).
      - run: cargo audit
