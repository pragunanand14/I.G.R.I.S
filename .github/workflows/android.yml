name: Android

# Builds the IGRIS Android app (the same app crate and UI as the desktop) and
# tests it on an emulator: install, launch, check IGRIS's own log, then pair it
# with a real IGRIS device hub on this host through a real relay and run a
# cross-device task with a signed approval, all through the phone's UI.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "igris-core/**"
      - "src-tauri/**"
      - "plugins/**"
      - "src/**"
      - "package.json"
      - "Cargo.lock"
      - "igris-relay/**"
      - "scripts/android-smoke.sh"
      - "scripts/android-cross-device.sh"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  android:
    name: Android build + emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android
      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build APK (x86_64 for the emulator, arm64 for phones)
        run: npx tauri android build --debug --apk --target x86_64 --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: igris-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Host side of the cross-device test (relay + "CI PC" device hub)
        run: cargo build -p igris-relay -p igris-core --example device_peer
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/android-smoke.sh; s=$?; ./scripts/android-cross-device.sh; c=$?; exit $((s | c))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-artifacts/
          if-no-files-found: ignore
