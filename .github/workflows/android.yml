name: Android

# Builds the IGRIS Android app (the same app crate and UI as the desktop) and
# tests it on an emulator: install, launch, check IGRIS's own log, then pair it
# with a real IGRIS device hub on this host through ntfy.sh (the default) and run a
# cross-device task with a signed approval, all through the phone's UI.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "igris-core/**"
      - "src-tauri/**"
      - "plugins/**"
      - "src/**"
      - "package.json"
      - "Cargo.lock"
      - "igris-relay/**"
      - "scripts/android-smoke.sh"
      - "scripts/android-cross-device.sh"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  android:
    name: Android build + emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android
      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build APK (x86_64 for the emulator, arm64 for phones)
        run: npx tauri android build --debug --apk --target x86_64 --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: igris-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Host side of the cross-device test ("CI PC" device hub)
        run: cargo build -p igris-core --example device_peer
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/android-smoke.sh; s=$?; ./scripts/android-cross-device.sh; c=$?; exit $((s | c))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-artifacts/
          if-no-files-found: ignore

  # After the phone checks pass on main: build the app for real phones (arm64, optimised), sign it with
  # IGRIS's own key, and publish it as the "IGRIS phone (latest)" release, so the phone app is one tap to
  # download and each update installs over the previous one.
  phone-release:
    name: Publish the phone app (after the checks pass)
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    # Queued, never cut off half-way through publishing.
    concurrency:
      group: phone-release
      cancel-in-progress: false
    env:
      HAS_KEY_SECRET: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-release
      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      # The signing key: the ANDROID_KEYSTORE_B64 secret if the owner set one, otherwise a key IGRIS's builds
      # made once and keep in the Actions cache (so every update is signed the same way).
      # Only without the secret: a key made once and kept in the Actions cache. Weaker (other workflows of this
      # public repo could read the cache, and an unused cache entry expires after 7 days), so the secret wins.
      - name: Signing key (kept between builds)
        if: env.HAS_KEY_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.igris-signing
          key: igris-signing-v1
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.igris-signing
          if [ -n "$KEYSTORE_B64" ]; then
            # The owner's key: kept outside the cached folder, so it never ends up in the cache.
            mkdir -p ~/.igris-secret-signing
            echo "$KEYSTORE_B64" | base64 -d > ~/.igris-secret-signing/igris.jks
            printf '%s' "$KEYSTORE_PASSWORD" > ~/.igris-secret-signing/password
            echo "KEYDIR=$HOME/.igris-secret-signing" >> "$GITHUB_ENV"
          else
            echo "KEYDIR=$HOME/.igris-signing" >> "$GITHUB_ENV"
          fi
          if [ -z "$KEYSTORE_B64" ] && [ ! -f ~/.igris-signing/igris.jks ]; then
            head -c 24 /dev/urandom | base64 | tr -d '/+=' > ~/.igris-signing/password
            keytool -genkeypair -keystore ~/.igris-signing/igris.jks -alias igris -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$(cat ~/.igris-signing/password)" -keypass "$(cat ~/.igris-signing/password)" -dname "CN=IGRIS"
            echo "::notice::Made a new signing key for the phone app (kept in the Actions cache)."
          fi
          echo "Signing with the key in $( [ -n "$KEYSTORE_B64" ] && echo 'the ANDROID_KEYSTORE_B64 secret' || echo 'the Actions cache' )."
      - name: Build the phone app (arm64)
        run: npx tauri android build --apk --target aarch64 --ci
      - name: Sign
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::No release APK was built"; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -f -p 4 "$apk" igris-aligned.apk
          # apksigner reads the password as a line, so it must end with a newline.
          pw="$RUNNER_TEMP/igris-password"
          printf '%s\n' "$(cat "$KEYDIR/password")" > "$pw"
          "$bt/apksigner" sign --ks "$KEYDIR/igris.jks" --ks-key-alias igris \
            --ks-pass "file:$pw" --key-pass "file:$pw" \
            --out IGRIS-phone.apk igris-aligned.apk
          "$bt/apksigner" verify --print-certs IGRIS-phone.apk | head -3
          rm -f "$pw"
          ls -la IGRIS-phone.apk
      - name: Publish "IGRIS phone (latest)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short HEAD)
          notes="The IGRIS phone app, built from $short after every phone check passed on an emulator (start, tools, messages, Hey IGRIS, the assistant panel, pairing with a PC).

          Install: open this page on your phone, tap IGRIS-phone.apk, then Install. Updates from here install over the previous version.
          The first time only: if your phone says the app conflicts with an existing one, uninstall the old IGRIS first (builds before this page were signed differently)."
          # Update in place (the download link never disappears): move the tag, then replace the file.
          git tag -f phone-latest "$GITHUB_SHA"
          git push -f origin refs/tags/phone-latest
          if gh release view phone-latest >/dev/null 2>&1; then
            gh release upload phone-latest IGRIS-phone.apk --clobber
            gh release edit phone-latest --notes "$notes" --prerelease --title "IGRIS phone (latest)"
          else
            gh release create phone-latest IGRIS-phone.apk --prerelease --title "IGRIS phone (latest)" --notes "$notes" --verify-tag
          fi
