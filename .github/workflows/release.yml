name: Release

# Builds the Windows installers (NSIS .exe and .msi). Pushing a tag like v0.2.0
# creates a draft GitHub release with them; a push to main that changes the app
# (or running it manually) uploads the installers as workflow artifacts, so the
# latest main always has a fresh installer.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "igris-core/**"
      - "igris-relay/**"
      - "src-tauri/**"
      - "plugins/**"
      - "src/**"
      - "package.json"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Build installers
        run: npx tauri build --bundles nsis,msi
      - name: Build the relay (for phone ↔ PC; see docs/CROSS_DEVICE.md)
        run: cargo build --release --locked -p igris-relay --bin igris-relay
      - uses: actions/upload-artifact@v4
        with:
          name: igris-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/igris-relay.exe
          if-no-files-found: error
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/igris-relay.exe
