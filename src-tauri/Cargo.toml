[package]
name = "igris"
version = "0.1.0"
description = "IGRIS — Intelligent General-purpose Responsive Intelligence System"
authors = ["IGRIS contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (rust-lang/cargo#8519).
name = "igris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = "0.39"
starship-battery = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "stream", "json", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
regex = "1"
html2text = "0.14"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
trash = "5"
walkdir = "2"
dirs = "6"
tauri-plugin-notification = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pdf-extract = "0.12.1"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort): untrusted-input parsers (PDF) and background tasks rely on
# catching panics; with `abort` one malformed file would crash the app.
panic = "unwind"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "0.9"

[target."cfg(windows)".dependencies]
lnk = "0.6"
# Computer control (input, windows, UI Automation) and process-tree cleanup.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # OCR fallback (Windows.Media.Ocr, built into Windows).
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
